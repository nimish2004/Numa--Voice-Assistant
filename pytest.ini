[pytest]
# Pytest configuration for Numa

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout
timeout = 10
timeout_method = thread

# Output
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    concurrency: marks tests that check concurrent behavior
